---
# update_sops_secrets.yml - Reusable task to update SOPS-encrypted secrets files
#
# This task allows you to programmatically update secrets in SOPS-encrypted files
# from within Ansible playbooks. It supports both setting and unsetting (removing) keys.
#
# Usage:
#   - name: Update secrets in SOPS file
#     include_tasks: tasks/update_sops_secrets.yml
#     vars:
#       update_condition: true
#       secrets_to_update:
#         api_token: "new-token-value"
#         old_key: ""  # Empty string removes the key
#
# Parameters:
#   update_condition (bool, required): When true, the update runs. Use this to gate updates.
#   secrets_to_update (dict, required): Dictionary of key-value pairs to update.
#     - Non-empty values: Set/update the key
#     - Empty strings: Remove the key from the file
#   secrets_file (string, optional): Path to SOPS file.
#     Defaults to auto-detected path:
#     - If playbook is in playbooks/ directory: ../inventory/host_vars/{{ inventory_hostname }}/secrets.sops.yaml
#     - Otherwise: inventory/host_vars/{{ inventory_hostname }}/secrets.sops.yaml
#     Override by setting secrets_file explicitly
#   sops_age_keyfile (string, optional): Path to age keyfile.
#     Defaults to: ~/.config/sops/age/keys.txt
#   debug_sops (bool, optional): Enable debug output. Defaults to false

- name: Set secrets file path (if not provided)
  ansible.builtin.set_fact:
    secrets_file: >-
      {{
        secrets_file | default(
          (playbook_dir + '/../inventory/host_vars/' + inventory_hostname + '/secrets.sops.yaml')
          if (playbook_dir.endswith('/playbooks') or '/playbooks/' in playbook_dir)
          else (playbook_dir + '/inventory/host_vars/' + inventory_hostname + '/secrets.sops.yaml')
        )
      }}
    sops_age_keyfile: "{{ sops_age_keyfile | default(lookup('env','HOME') + '/.config/sops/age/keys.txt') }}"
  when: update_condition | default(false)

- name: Check if secrets file exists
  ansible.builtin.stat:
    path: "{{ secrets_file }}"
  register: secrets_file_stat
  delegate_to: localhost
  become: false
  when: update_condition | default(false)

- name: Fail if secrets file does not exist
  ansible.builtin.fail:
    msg: "Secrets file not found: {{ secrets_file }}. Create it first with 'sops -e' or check the path."
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - not (secrets_file_stat.stat.exists | default(false) | bool)

- name: Verify age keyfile exists on localhost
  ansible.builtin.stat:
    path: "{{ sops_age_keyfile }}"
  delegate_to: localhost
  become: false
  register: agekey_stat
  when: update_condition | default(false)
  changed_when: false

- name: Fail if age keyfile missing
  ansible.builtin.fail:
    msg: "SOPS age keyfile not found on localhost: {{ sops_age_keyfile }}"
  when:
    - update_condition | default(false)
    - not (agekey_stat.stat.exists | default(false) | bool)

- name: Debug resolved secrets file path
  ansible.builtin.debug:
    msg: "Resolved secrets_file={{ secrets_file }} (playbook_dir={{ playbook_dir }})"
  when:
    - update_condition | default(false)
    - debug_sops | default(false) | bool
  no_log: false

- name: Compute keys to set/unset (for reporting + gating)
  ansible.builtin.set_fact:
    sops_keys_to_set: >-
      {{
        (secrets_to_update | default({})) | dict2items
        | selectattr('value','ne','')
        | selectattr('value','ne', none)
        | map(attribute='key')
        | list
      }}
    sops_keys_to_unset: >-
      {{
        (secrets_to_update | default({})) | dict2items
        | selectattr('value','equalto','')
        | map(attribute='key')
        | list
      }}
  when: update_condition | default(false)
  changed_when: false
  no_log: true

- name: Debug sops version (safe)
  ansible.builtin.command:
    argv: ['sops', '--version']
  delegate_to: localhost
  become: false
  register: sops_version
  when:
    - update_condition | default(false)
    - debug_sops | default(false) | bool
  changed_when: false
  failed_when: false

- name: Show sops version
  ansible.builtin.debug:
    var: sops_version.stdout
  when:
    - debug_sops | default(false) | bool
    - sops_version is defined

- name: Debug planned SOPS operations (safe)
  ansible.builtin.debug:
    msg: |
      SOPS file: {{ secrets_file }}
      Will set:   {{ sops_keys_to_set | default([]) | join(', ') }}
      Will unset: {{ sops_keys_to_unset | default([]) | join(', ') }}
      
      Note: Updated secrets in SOPS files will not be available in hostvars until
      the next playbook run. If you need the updated values in the same run,
      you'll need to decrypt and load them manually.
  when:
    - update_condition | default(false)
    - debug_sops | default(false) | bool
  no_log: false

- name: Update non-empty secrets in SOPS file (sops set, value via stdin)
  ansible.builtin.shell: |
    set -euo pipefail
    printf '%s' {{ (secrets_to_update[item] | to_json) | quote }} \
      | sops set --idempotent --value-stdin \
          --input-type yaml --output-type yaml \
          "{{ secrets_file }}" \
          '[{{ item | to_json }}]'
  args:
    executable: /bin/bash
  loop: "{{ sops_keys_to_set | default([]) }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_keyfile }}"
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - secrets_to_update is defined
    - sops_keys_to_set | default([]) | length > 0
  register: sops_set_result
  no_log: true
  changed_when: "'already set to the same value' not in (sops_set_result.stderr | default(''))"
  failed_when: false

- name: Remove empty secrets from SOPS file (sops unset)
  ansible.builtin.shell: |
    set -euo pipefail
    sops unset --idempotent \
      --input-type yaml --output-type yaml \
      "{{ secrets_file }}" \
      '[{{ item | to_json }}]'
  args:
    executable: /bin/bash
  loop: "{{ sops_keys_to_unset | default([]) }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_keyfile }}"
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - sops_keys_to_unset | default([]) | length > 0
  register: sops_unset_result
  no_log: true
  changed_when: "'key not found' not in (sops_unset_result.stderr | default(''))"
  failed_when: false

- name: Verify secrets file is still encrypted
  ansible.builtin.command:
    argv: ["sops", "filestatus", "{{ secrets_file }}"]
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_keyfile }}"
  register: sops_filestatus
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
  changed_when: false
  failed_when: sops_filestatus.rc != 0

- name: Combine set and unset results
  ansible.builtin.set_fact:
    sops_update_result:
      rc: "{{ ([set_rc, unset_rc] | select('number') | list + [0]) | max }}"
      changed: "{{ (sops_set_result.changed | default(false)) or (sops_unset_result.changed | default(false)) }}"
  vars:
    set_rc: >-
      {{
        (sops_set_result.results | default([]) | map(attribute='rc') | list | max)
        if (sops_set_result.results is defined and sops_set_result.results | length > 0)
        else ((sops_set_result.rc | default(0) | int) if sops_set_result is defined else 0)
      }}
    unset_rc: >-
      {{
        (sops_unset_result.results | default([]) | map(attribute='rc') | list | max)
        if (sops_unset_result.results is defined and sops_unset_result.results | length > 0)
        else ((sops_unset_result.rc | default(0) | int) if sops_unset_result is defined else 0)
      }}
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - secrets_to_update is defined
    - secrets_to_update | length > 0
  changed_when: false

- name: Fail if SOPS set operation failed
  ansible.builtin.fail:
    msg: |
      [FAILED] SOPS set operation failed
      
      Failed keys: {{ sops_set_result.results | default([]) | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') | default('(unknown)') }}
      
      First failure (rc={{ sops_set_result.results | default([]) | selectattr('rc', 'ne', 0) | map(attribute='rc') | first | default('unknown') }}):
      {{ (sops_set_result.results | default([]) | selectattr('rc', 'ne', 0) | first).stdout | default('(empty)') }}
      {{ (sops_set_result.results | default([]) | selectattr('rc', 'ne', 0) | first).stderr | default('(empty)') }}
      
      Common causes:
      1. Age keyfile not found or incorrect (check SOPS_AGE_KEY_FILE={{ sops_age_keyfile }})
      2. SOPS command syntax error (check if 'sops set' command is supported)
      3. File permissions issue
      4. Encryption key mismatch
      
      To debug: Check the error output above and verify your SOPS configuration.
  when:
    - update_condition | default(false)
    - sops_set_result is defined
    - (sops_set_result.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0) or ((sops_set_result.rc | default(0)) != 0)
  no_log: false

- name: Fail if SOPS unset operation failed
  ansible.builtin.fail:
    msg: |
      [FAILED] SOPS unset operation failed
      
      Failed keys: {{ sops_unset_result.results | default([]) | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') | default('(unknown)') }}
      
      First failure (rc={{ sops_unset_result.results | default([]) | selectattr('rc', 'ne', 0) | map(attribute='rc') | first | default('unknown') }}):
      {{ (sops_unset_result.results | default([]) | selectattr('rc', 'ne', 0) | first).stdout | default('(empty)') }}
      {{ (sops_unset_result.results | default([]) | selectattr('rc', 'ne', 0) | first).stderr | default('(empty)') }}
      
      Common causes:
      1. Age keyfile not found or incorrect (check SOPS_AGE_KEY_FILE={{ sops_age_keyfile }})
      2. Key to unset doesn't exist in the file
      3. File permissions issue
      4. Encryption key mismatch
      
      To debug: Check the error output above and verify your SOPS configuration.
  when:
    - update_condition | default(false)
    - sops_unset_result is defined
    - (sops_unset_result.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0) or ((sops_unset_result.rc | default(0)) != 0)
  no_log: false

- name: Display secrets update success
  ansible.builtin.debug:
    msg: |
      [OK] Secrets file updated: {{ secrets_file }}
      Set:   {{ (sops_keys_to_set | default([]) | length > 0) | ternary(sops_keys_to_set | join(', '), '(none)') }}
      Unset: {{ (sops_keys_to_unset | default([]) | length > 0) | ternary(sops_keys_to_unset | join(', '), '(none)') }}
      
      Note: Updated secrets are written to the SOPS file, but will not be available
      in hostvars until the next playbook run. If you need updated values in the
      same run, decrypt and load them manually.
  vars:
    set_success: >-
      {{
        (sops_keys_to_set | default([]) | length == 0)
        or (
          sops_set_result is defined and
          (sops_set_result.results | default([]) | selectattr('rc','equalto',0) | list | length
            == (sops_keys_to_set | default([]) | length))
        )
      }}
    unset_success: >-
      {{
        (sops_keys_to_unset | default([]) | length == 0)
        or (
          sops_unset_result is defined and
          (sops_unset_result.results | default([]) | selectattr('rc','equalto',0) | list | length
            == (sops_keys_to_unset | default([]) | length))
        )
      }}
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - secrets_to_update is defined
    - set_success | bool
    - unset_success | bool
