[defaults]
# inventory = inventory/hosts.ini  # Set to your inventory file
host_key_checking = False
retry_files_enabled = False

# Enable SOPS vars plugin to automatically decrypt .sops.yaml files
vars_plugins_enabled = host_group_vars,community.sops.sops

[community.sops]
# Age keyfile for SOPS decryption
# Generate with: age-keygen -o ~/.config/sops/age/keys.txt
age_keyfile = ~/.config/sops/age/keys.txt

# Alternative: Use YubiKey for decryption
# Uncomment and set if using YubiKey:
# export SOPS_AGE_KEY_CMD="age-plugin-yubikey --identity"

[privilege_escalation]
become = True
become_method = sudo
