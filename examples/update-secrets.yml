---
# Example: Basic SOPS secrets update
#
# Update secrets with values you already have.
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini examples/update-secrets.yml -e "inventory_hostname=your-host"

- name: Update Secrets in SOPS File
  hosts: localhost
  gather_facts: false
  
  vars:
    # Example: Secrets you want to update
    # These could come from:
    # - Variables passed via -e
    # - Previous tasks
    # - User input
    # - External sources
    api_token: "new-api-token-12345"
    database_password: "secure-password-here"

  tasks:
    - name: Update secrets in SOPS file
      include_tasks: ../tasks/update_sops_secrets.yml
      vars:
        update_condition: true
        secrets_to_update:
          api_token: "{{ api_token }}"
          database_password: "{{ database_password }}"
          # Empty string removes the key
          old_bootstrap_token: ""

    - name: Display success message
      ansible.builtin.debug:
        msg: |
          [OK] Secrets updated in SOPS file!
          
          Updated keys:
          - api_token
          - database_password
          - old_bootstrap_token (removed)
          
          Note: These changes will be available in hostvars on the next playbook run.
