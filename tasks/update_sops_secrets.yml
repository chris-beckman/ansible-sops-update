---
# Update SOPS-encrypted secrets. Pass update_condition: true, secrets_to_update: { key: value }.
# secrets_scope: host | global. secrets_file overrides path.

- name: Fail if update requested but secrets_to_update not provided
  ansible.builtin.fail:
    msg: |
      update_sops_secrets was called with update_condition true but secrets_to_update is not defined.
      Pass a dict, e.g. secrets_to_update: { 'my_key': my_value }
  when:
    - update_condition | default(false)
    - secrets_to_update is not defined

- name: Set inventory base and age keyfile
  ansible.builtin.set_fact:
    _sops_inventory_base: >-
      {{
        inventory_dir
        if (inventory_dir is defined and inventory_dir | length > 0)
        else ((playbook_dir + '/../inventory') if playbook_dir is defined else '')
      }}
    sops_age_keyfile: "{{ sops_age_keyfile | default(lookup('env', 'SOPS_AGE_KEY_FILE') | default(lookup('env', 'HOME') + '/.config/sops/age/keys.txt')) }}"
    _sops_scope: "{{ secrets_scope | default('host') }}"
  when: update_condition | default(false)

- name: Set secrets file path
  ansible.builtin.set_fact:
    secrets_file: >-
      {{
        secrets_file
        if secrets_file is defined
        else (_sops_inventory_base + '/group_vars/all/secrets.sops.yaml')
        if _sops_scope == 'global'
        else (_sops_inventory_base + '/host_vars/' + inventory_hostname + '/secrets.sops.yaml')
      }}
  when: update_condition | default(false)

- name: Check if secrets file exists
  ansible.builtin.stat:
    path: "{{ secrets_file }}"
  register: secrets_file_stat
  delegate_to: localhost
  become: false
  when: update_condition | default(false)

- name: Fail if secrets file does not exist
  ansible.builtin.fail:
    msg: "Secrets file not found: {{ secrets_file }}. Create it first with 'sops -e' or check the path."
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - not (secrets_file_stat.stat.exists | default(false) | bool)

- name: Verify age keyfile exists on localhost
  ansible.builtin.stat:
    path: "{{ sops_age_keyfile }}"
  delegate_to: localhost
  become: false
  register: agekey_stat
  when: update_condition | default(false)
  changed_when: false

- name: Fail if age keyfile missing
  ansible.builtin.fail:
    msg: "SOPS age keyfile not found on localhost: {{ sops_age_keyfile }}"
  when:
    - update_condition | default(false)
    - not (agekey_stat.stat.exists | default(false) | bool)

- name: Debug resolved secrets file path
  ansible.builtin.debug:
    msg: "Resolved secrets_file={{ secrets_file }} (scope={{ _sops_scope }})"
  when:
    - update_condition | default(false)
    - debug_sops | default(false) | bool
  no_log: false

- name: Materialize secrets_to_update as fact
  ansible.builtin.set_fact:
    _sops_secrets_dict: "{{ secrets_to_update | default({}) }}"
  when: update_condition | default(false)
  no_log: true

- name: Compute keys to set/unset
  ansible.builtin.set_fact:
    sops_keys_to_set: >-
      {{
        (_sops_secrets_dict | default({}) | dict2items
         | dict_selectattr('value', 'ne', '')
         | dict_rejectattr('value', 'none')
         | map(attribute='key')
         | list)
      }}
    sops_keys_to_unset: >-
      {{
        (_sops_secrets_dict | default({}) | dict2items
         | dict_selectattr('value', 'eq', '')
         | map(attribute='key')
         | list)
      }}
  when: update_condition | default(false)
  changed_when: false
  no_log: true

- name: Initialize list-value state
  ansible.builtin.set_fact:
    _sops_list_value_keys: []
    _sops_list_items_augmented: []
    _sops_list_indexed_elements: []
  when: update_condition | default(false)
  changed_when: false
  no_log: true

- name: Collect list-valued secrets
  ansible.builtin.set_fact:
    _sops_list_value_keys: "{{ _sops_list_value_keys + [item.key] }}"
    _sops_list_items_augmented: "{{ _sops_list_items_augmented + [item | combine({'_indexed_values': (range(0, item.value | length) | zip(item.value) | list)})] }}"
  loop: "{{ (_sops_secrets_dict | default({})) | dict2items | dict_selectattr('value', 'ne', '') | dict_rejectattr('value', 'none') | list }}"
  when: (item.value | type_debug) == 'list'
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  no_log: true

- name: Flatten list-valued secrets into indexed elements
  ansible.builtin.set_fact:
    _sops_list_indexed_elements: "{{ _sops_list_indexed_elements + [{'key': item.0.key, 'index': item.1.0, 'value': item.1.1}] }}"
  loop: "{{ (_sops_list_items_augmented | default([])) | subelements('_indexed_values', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.key }}[{{ item.1.0 }}]"
  when: (_sops_list_items_augmented | default([]) | length) > 0
  changed_when: false
  no_log: true

- name: Debug planned SOPS operations
  ansible.builtin.debug:
    msg: |
      SOPS file: {{ secrets_file }}
      Will set:   {{ sops_keys_to_set | default([]) | join(', ') }}
      Will unset: {{ sops_keys_to_unset | default([]) | join(', ') }}
      Note: Updated secrets will not be in hostvars until the next run.
  when:
    - update_condition | default(false)
    - debug_sops | default(false) | bool
  no_log: false

- name: Update scalar secrets in SOPS file
  ansible.builtin.command:
    argv:
      - sops
      - set
      - --idempotent
      - --value-stdin
      - --input-type
      - yaml
      - --output-type
      - yaml
      - "{{ secrets_file }}"
      - "[{{ item.key | to_json }}]"
    stdin: "{{ item.value | to_json }}"
  loop: >-
    {{ _sops_secrets_dict | default({}) | dict2items
       | dict_selectattr('value', 'ne', '')
       | dict_rejectattr('value', 'none')
       | list }}
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_keyfile }}"
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - _sops_secrets_dict | default({}) | length > 0
    - (item.value | type_debug) != 'list'
  register: sops_set_result
  no_log: true
  changed_when: "'already set to the same value' not in ((sops_set_result.stderr | default('')) + (sops_set_result.stdout | default('')))"
  failed_when: false

- name: Reset list-valued secrets before indexed writes
  ansible.builtin.command:
    argv:
      - sops
      - unset
      - --idempotent
      - --input-type
      - yaml
      - --output-type
      - yaml
      - "{{ secrets_file }}"
      - "[{{ item | to_json }}]"
  loop: "{{ _sops_list_value_keys | default([]) }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_keyfile }}"
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - (_sops_list_value_keys | default([]) | length) > 0
  register: sops_set_list_reset_result
  no_log: true
  changed_when: false
  failed_when: false

- name: Write list-valued secrets via indexed paths
  ansible.builtin.command:
    argv:
      - sops
      - set
      - --idempotent
      - --value-stdin
      - --input-type
      - yaml
      - --output-type
      - yaml
      - "{{ secrets_file }}"
      - "[{{ item.key | to_json }}][{{ item.index }}]"
    stdin: "{{ item.value | to_json }}"
  loop: "{{ _sops_list_indexed_elements | default([]) }}"
  loop_control:
    label: "{{ item.key }}[{{ item.index }}]"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_keyfile }}"
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - (_sops_list_indexed_elements | default([]) | length) > 0
  register: sops_set_list_result
  no_log: true
  changed_when: "'already set to the same value' not in ((sops_set_list_result.stderr | default('')) + (sops_set_list_result.stdout | default('')))"
  failed_when: false

- name: Remove empty secrets from SOPS file
  ansible.builtin.command:
    argv:
      - sops
      - unset
      - --idempotent
      - --input-type
      - yaml
      - --output-type
      - yaml
      - "{{ secrets_file }}"
      - "[{{ item | to_json }}]"
  loop: "{{ sops_keys_to_unset | default([]) }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_keyfile }}"
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - sops_keys_to_unset | default([]) | length > 0
  register: sops_unset_result
  no_log: true
  changed_when: "'key not found' not in ((sops_unset_result.stderr | default('')) + (sops_unset_result.stdout | default('')))"
  failed_when: false

- name: Verify secrets file is still encrypted
  ansible.builtin.command:
    argv: ["sops", "filestatus", "{{ secrets_file }}"]
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_keyfile }}"
  register: sops_filestatus
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
  changed_when: false
  failed_when: sops_filestatus.rc != 0

- name: Compute set failures (scalar + list)
  ansible.builtin.set_fact:
    _sops_set_failures: >-
      {{
        (sops_set_result.results | default([]) | dict_selectattr('rc', 'ne', 0) | list)
        + (sops_set_list_reset_result.results | default([])
            | dict_selectattr('rc', 'ne', 0)
            | dict_rejectattr('stderr', 'search', 'key not found')
            | dict_rejectattr('stdout', 'search', 'key not found')
            | list)
        + (sops_set_list_result.results | default([]) | dict_selectattr('rc', 'ne', 0) | list)
      }}
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
  changed_when: false
  no_log: true

- name: Fail if SOPS set operation failed
  ansible.builtin.fail:
    msg: |
      [FAILED] SOPS set operation failed
      Failed keys: {{ _sops_set_failures | default([]) | map(attribute='item') | list | join(', ') | default('(unknown)') }}
      First failure: {{ (_sops_set_failures | default([]) | first).stdout | default('(empty)') }}
      {{ (_sops_set_failures | default([]) | first).stderr | default('(empty)') }}
      Check SOPS_AGE_KEY_FILE={{ sops_age_keyfile }}
  when:
    - update_condition | default(false)
    - _sops_set_failures is defined
    - (_sops_set_failures | default([]) | length) > 0
  no_log: false

- name: Compute unset failures (exclude key not found)
  ansible.builtin.set_fact:
    sops_unset_real_failures: >-
      {{
        sops_unset_result.results | default([])
        | dict_selectattr('rc', 'ne', 0)
        | dict_rejectattr('stderr', 'search', 'key not found')
        | dict_rejectattr('stdout', 'search', 'key not found')
      }}
  when:
    - update_condition | default(false)
    - sops_unset_result is defined
  changed_when: false

- name: Fail if SOPS unset operation failed
  ansible.builtin.fail:
    msg: |
      [FAILED] SOPS unset operation failed
      Failed keys: {{ sops_unset_real_failures | map(attribute='item') | list | join(', ') | default('(unknown)') }}
      First failure: {{ (sops_unset_real_failures | first).stdout | default('(empty)') }}
      {{ (sops_unset_real_failures | first).stderr | default('(empty)') }}
      Check SOPS_AGE_KEY_FILE={{ sops_age_keyfile }}
  when:
    - update_condition | default(false)
    - sops_unset_real_failures is defined
    - sops_unset_real_failures | length > 0
  no_log: false

- name: Display secrets update success
  ansible.builtin.debug:
    msg: |
      [OK] Secrets file updated: {{ secrets_file }}
      Set:   {{ (sops_keys_to_set | default([]) | length > 0) | ternary(sops_keys_to_set | join(', '), '(none)') }}
      Unset: {{ (sops_keys_to_unset | default([]) | length > 0) | ternary(sops_keys_to_unset | join(', '), '(none)') }}
      Note: Updated secrets will not be in hostvars until the next run.
  vars:
    set_success: >-
      {{
        ((sops_keys_to_set | default([]) | length == 0) and ((_sops_list_value_keys | default([]) | length) == 0))
        or ((_sops_set_failures | default([]) | length) == 0)
      }}
    unset_success: >-
      {{
        (sops_keys_to_unset | default([]) | length == 0)
        or (sops_unset_real_failures | default([]) | length == 0)
      }}
  when:
    - update_condition | default(false)
    - secrets_file_stat is defined
    - secrets_file_stat.stat.exists | default(false) | bool
    - secrets_to_update is defined
    - set_success | bool
    - unset_success | bool
